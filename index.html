<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຕາຕະລາງການເຮັດວຽກ - Smart Schedule AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Google Fonts Lao -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans Lao', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background-color: #f8fafc;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Configure PDF.js worker
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const { useState, useEffect, useRef } = React;

        const DAYS_LAO = ['ອາທິດ', 'ຈັນ', 'ອັງຄານ', 'ພຸດ', 'ພະຫັດ', 'ສຸກ', 'ເສົາ'];
        const MONTHS_LAO = [
            'ມັງກອນ', 'ກຸມພາ', 'ມີນາ', 'ເມສາ', 'ພຶດສະພາ', 'ມິຖຸນາ',
            'ກໍລະກົດ', 'ສິງຫາ', 'ກັນຍາ', 'ຕຸລາ', 'ພະຈິກ', 'ທັນວາ'
        ];

        // Shift color mapping
        const SHIFT_TYPES = {
            morning: { label: 'ກະເຊົ້າ (Morning)', bg: 'bg-amber-100', text: 'text-amber-800', border: 'border-amber-300', badge: 'bg-amber-500' },
            afternoon: { label: 'ກະບ່າຍ (Afternoon)', bg: 'bg-sky-100', text: 'text-sky-800', border: 'border-sky-300', badge: 'bg-sky-500' },
            night: { label: 'ກະດຶກ (Night)', bg: 'bg-indigo-100', text: 'text-indigo-800', border: 'border-indigo-300', badge: 'bg-indigo-600' },
            normal: { label: 'ເວລາປົກກະຕິ (Standard)', bg: 'bg-emerald-100', text: 'text-emerald-800', border: 'border-emerald-300', badge: 'bg-emerald-500' },
            overtime: { label: 'ໂອທີ (OT)', bg: 'bg-rose-100', text: 'text-rose-800', border: 'border-rose-300', badge: 'bg-rose-500' },
            off: { label: 'ວັນພັກ (Day Off)', bg: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-300', badge: 'bg-slate-400' }
        };

        function App() {
            // State variables
            const [currentDate, setCurrentDate] = useState(new Date());
            const [userName, setUserName] = useState(() => localStorage.getItem('work_user_name') || 'ສົມໄຊ');
            const [events, setEvents] = useState(() => {
                const saved = localStorage.getItem('work_schedule_events');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) { console.error(e); }
                }
                // Initial sample data if empty
                const todayStr = new Date().toISOString().split('T')[0];
                return [
                    {
                        id: 'demo-1',
                        date: todayStr,
                        title: 'ກະເຊົ້າ (Shift A)',
                        startTime: '08:00',
                        endTime: '16:00',
                        type: 'morning',
                        location: 'ຫ້ອງການໃຫຍ່ ຕຶກ A',
                        notes: 'ກວດເຊັກເອກະສານປະຈຳເດືອນ',
                        assignedTo: 'ສົມໄຊ',
                        notified: false
                    }
                ];
            });

            const [selectedDateStr, setSelectedDateStr] = useState(new Date().toISOString().split('T')[0]);
            const [viewMode, setViewMode] = useState('month'); // 'month', 'week', 'list'
            const [isPdfModalOpen, setIsPdfModalOpen] = useState(false);
            const [isAddEditModalOpen, setIsAddEditModalOpen] = useState(false);
            const [editingEvent, setEditingEvent] = useState(null);
            
            // Notification state
            const [notifPermission, setNotifPermission] = useState(
                typeof Notification !== 'undefined' ? Notification.permission : 'default'
            );
            const [toast, setToast] = useState(null);

            // Save settings & events
            useEffect(() => {
                localStorage.setItem('work_user_name', userName);
            }, [userName]);

            useEffect(() => {
                localStorage.setItem('work_schedule_events', JSON.stringify(events));
            }, [events]);

            // Show temporary toast message
            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const requestNotificationPermission = async () => {
                if (!("Notification" in window)) {
                    showToast("ບຣາວເຊີຂອງທ່ານບໍ່ຮອງຮັບ Chrome Notifications", "error");
                    return;
                }
                try {
                    const permission = await Notification.requestPermission();
                    setNotifPermission(permission);
                    if (permission === 'granted') {
                        new Notification("ຕັ້ງແຈ້ງເຕືອນ Chrome ສຳເລັດ!", {
                            body: "ລະບົບຈະແຈ້ງເຕືອນທ່ານເມື່ອຮອດເວລາເຮັດວຽກຕາມຕາຕະລາງ",
                            icon: "https://cdn-icons-png.flaticon.com/512/3652/3652191.png"
                        });
                        showToast("ເປີດການແຈ້ງເຕືອນ Chrome เรียบร้อย!", "success");
                    } else {
                        showToast("ທ່ານໄດ້ປະຕິເສດການແຈ້ງເຕືອນ Chrome", "warning");
                    }
                } catch (err) {
                    console.error("Notification permission error:", err);
                }
            };

            // Background checker for Chrome notifications
            useEffect(() => {
                const interval = setInterval(() => {
                    if (notifPermission !== 'granted') return;

                    const now = new Date();
                    const dateStr = now.toISOString().split('T')[0];
                    const currentHours = String(now.getHours()).padStart(2, '0');
                    const currentMinutes = String(now.getMinutes()).padStart(2, '0');
                    const timeNowStr = `${currentHours}:${currentMinutes}`;

                    setEvents(prevEvents => {
                        let hasChanges = false;
                        const updated = prevEvents.map(evt => {
                            if (evt.date === dateStr && !evt.notified && evt.startTime) {
                                // Calculate alert time (e.g. at start time or 15m before)
                                const [h, m] = evt.startTime.split(':').map(Number);
                                const eventTimeMinutes = h * 60 + m;
                                const nowMinutes = now.getHours() * 60 + now.getMinutes();

                                // Notify if within 15 mins before or at exact start time
                                if (eventTimeMinutes - nowMinutes <= 15 && eventTimeMinutes - nowMinutes >= 0) {
                                    hasChanges = true;
                                    new Notification(`⏰ ແຈ້ງເຕືອນເຂົ້າຮອບວຽກ: ${evt.title}`, {
                                        body: `ເວລາ: ${evt.startTime} - ${evt.endTime}\nສະຖານທີ່: ${evt.location || 'ບໍ່ໄດ້ລະບຸ'}\n${evt.notes || ''}`,
                                        icon: "https://cdn-icons-png.flaticon.com/512/3652/3652191.png",
                                        requireInteraction: true
                                    });
                                    return { ...evt, notified: true };
                                }
                            }
                            return evt;
                        });
                        return hasChanges ? updated : prevEvents;
                    });
                }, 30000); // check every 30s

                return () => clearInterval(interval);
            }, [notifPermission]);

            // Calendar Navigation Helpers
            const prevMonth = () => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            };
            const nextMonth = () => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            };
            const goToToday = () => {
                const today = new Date();
                setCurrentDate(today);
                setSelectedDateStr(today.toISOString().split('T')[0]);
            };

            // Event Handlers
            const handleSaveEvent = (eventData) => {
                if (eventData.id) {
                    setEvents(events.map(e => e.id === eventData.id ? eventData : e));
                    showToast("ອັບເດດຂໍ້ມູນຕາຕະລາງສຳເລັດ!", "success");
                } else {
                    const newEvt = { ...eventData, id: 'evt-' + Date.now(), notified: false };
                    setEvents([...events, newEvt]);
                    showToast("ເພີ່ມຕາຕະລາງໃໝ່ສຳເລັດ!", "success");
                }
                setIsAddEditModalOpen(false);
                setEditingEvent(null);
            };

            const handleDeleteEvent = (id) => {
                setEvents(events.filter(e => e.id !== id));
                showToast("ລົບລາຍການສຳເລັດ", "info");
            };

            const handleImportParsedEvents = (newEvents) => {
                // Filter out duplicates if needed or combine
                setEvents(prev => [...prev, ...newEvents]);
                showToast(`ນໍາເຂົ້າຕາຕະລາງສຳເລັດ ${newEvents.length} ລາຍການ!`, "success");
            };

            // Export events to .ics file
            const exportToICal = () => {
                if (events.length === 0) {
                    showToast("ບໍ່ມີຂໍ້ມູນຕາຕະລາງເພື່ອສົ່ງອອກ", "warning");
                    return;
                }
                let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//SmartWorkSchedule//LA//EN\n";
                events.forEach(e => {
                    if (!e.date) return;
                    const cleanDate = e.date.replace(/-/g, '');
                    const startTime = (e.startTime || '08:00').replace(':', '') + '00';
                    const endTime = (e.endTime || '17:00').replace(':', '') + '00';

                    icsContent += "BEGIN:VEVENT\n";
                    icsContent += `SUMMARY:${e.title}\n`;
                    icsContent += `DTSTART:${cleanDate}T${startTime}\n`;
                    icsContent += `DTEND:${cleanDate}T${endTime}\n`;
                    if (e.location) icsContent += `LOCATION:${e.location}\n`;
                    if (e.notes) icsContent += `DESCRIPTION:${e.notes}\n`;
                    icsContent += "END:VEVENT\n";
                });
                icsContent += "END:VCALENDAR";

                const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `work_schedule_${userName}.ics`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("ສົ່ງອອກໄຟລ໌ iCal (.ics) ສຳເລັດ!", "success");
            };

            return (
                <div class="min-h-screen flex flex-col pb-12">
                    {}
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="bg-gradient-to-tr from-sky-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                                    <i class="fa-solid fa-calendar-check text-xl"></i>
                                </div>
                                <div>
                                    <h1 class="text-lg font-bold text-slate-800 leading-tight">ຕາຕະລາງການເຮັດວຽກ AI</h1>
                                    <p class="text-xs text-slate-500 hidden sm:block">ຈັດການຕາຕະລາງງານ & ແຈ້ງເຕືອນອັດໂຕໂນມັດ</p>
                                </div>
                            </div>

                            {/* User Name & Notification Setup */}
                            <div class="flex items-center space-x-2 sm:space-x-4">
                                <div class="flex items-center bg-slate-100 rounded-lg px-3 py-1.5 border border-slate-200">
                                    <i class="fa-solid fa-user-circle text-sky-600 mr-2"></i>
                                    <span class="text-xs text-slate-500 mr-1 hidden sm:inline">ຊື່:</span>
                                    <input 
                                        type="text" 
                                        value={userName} 
                                        onChange={(e) => setUserName(e.target.value)}
                                        class="bg-transparent font-medium text-xs sm:text-sm text-slate-800 focus:outline-none w-24 sm:w-28"
                                        placeholder="ໃສ່ຊື່ຂອງທ່ານ"
                                    />
                                </div>

                                <button 
                                    onClick={requestNotificationPermission}
                                    class={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 transition-all ${
                                        notifPermission === 'granted' 
                                            ? 'bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100' 
                                            : 'bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 animate-pulse'
                                    }`}
                                    title="ຕັ້ງແຈ້ງເຕືອນ Chrome"
                                >
                                    <i class={`fa-solid ${notifPermission === 'granted' ? 'fa-bell' : 'fa-bell-slash'}`}></i>
                                    <span class="hidden md:inline">
                                        {notifPermission === 'granted' ? 'ເປີດແຈ້ງເຕືອນແລ້ວ' : 'ເປີດແຈ້ງເຕືອນ Chrome'}
                                    </span>
                                </button>

                                <button 
                                    onClick={() => setIsPdfModalOpen(true)}
                                    class="bg-sky-600 hover:bg-sky-700 text-white px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium shadow-sm transition-all flex items-center space-x-1.5"
                                >
                                    <i class="fa-solid fa-file-pdf"></i>
                                    <span>ອັບໂຫຼດ PDF AI</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Toast Alert Popup */}
                    {toast && (
                        <div class="fixed top-20 right-4 z-50 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 text-sm animate-bounce">
                            <i class={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-emerald-400' : toast.type === 'error' ? 'fa-circle-xmark text-rose-400' : 'fa-circle-info text-sky-400'}`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 flex-grow w-full">
                        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            
                            {}
                            <div class="lg:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
                                {/* Calendar Header Controls */}
                                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
                                    <div class="flex items-center space-x-3">
                                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800">
                                            {MONTHS_LAO[currentDate.getMonth()]} {currentDate.getFullYear()}
                                        </h2>
                                        <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                                            <button onClick={prevMonth} class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-md text-slate-600 transition">
                                                <i class="fa-solid fa-chevron-left text-xs"></i>
                                            </button>
                                            <button onClick={goToToday} class="px-2.5 py-1 text-xs font-semibold hover:bg-white rounded-md text-slate-700 transition">
                                                ມື້ນີ້
                                            </button>
                                            <button onClick={nextMonth} class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-md text-slate-600 transition">
                                                <i class="fa-solid fa-chevron-right text-xs"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Action Buttons */}
                                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                                        <button 
                                            onClick={exportToICal}
                                            class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition flex items-center space-x-1.5"
                                            title="Export to iCal / Google Calendar"
                                        >
                                            <i class="fa-solid fa-file-export text-slate-500"></i>
                                            <span>Export Calendar</span>
                                        </button>
                                        <button 
                                            onClick={() => {
                                                setEditingEvent({
                                                    date: selectedDateStr || new Date().toISOString().split('T')[0],
                                                    type: 'morning',
                                                    title: '',
                                                    startTime: '08:00',
                                                    endTime: '16:00',
                                                    location: '',
                                                    notes: ''
                                                });
                                                setIsAddEditModalOpen(true);
                                            }}
                                            class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm flex items-center space-x-1.5"
                                        >
                                            <i class="fa-solid fa-plus"></i>
                                            <span>ເພີ່ມຕາຕະລາງ</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Month Calendar Grid Component */}
                                <CalendarMonthGrid 
                                    currentDate={currentDate}
                                    events={events}
                                    selectedDateStr={selectedDateStr}
                                    onSelectDate={(dStr) => setSelectedDateStr(dStr)}
                                    onEventClick={(evt) => {
                                        setEditingEvent(evt);
                                        setIsAddEditModalOpen(true);
                                    }}
                                />
                            </div>

                            {}
                            <div class="space-y-6">
                                {/* Selected Day Details Card */}
                                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                                    <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-base">
                                                ຕາຕະລາງປະຈຳວັນ
                                            </h3>
                                            <p class="text-xs text-slate-500 font-medium">
                                                {formatDateLao(selectedDateStr)}
                                            </p>
                                        </div>
                                        <button 
                                            onClick={() => {
                                                setEditingEvent({
                                                    date: selectedDateStr,
                                                    type: 'morning',
                                                    title: '',
                                                    startTime: '08:00',
                                                    endTime: '16:00',
                                                    location: '',
                                                    notes: ''
                                                });
                                                setIsAddEditModalOpen(true);
                                            }}
                                            class="text-sky-600 hover:text-sky-700 text-xs font-semibold flex items-center space-x-1 bg-sky-50 px-2.5 py-1 rounded-md"
                                        >
                                            <i class="fa-solid fa-plus"></i>
                                            <span>ເພີ່ມ</span>
                                        </button>
                                    </div>

                                    {/* Events List for Selected Day */}
                                    <DayEventsList 
                                        events={events.filter(e => e.date === selectedDateStr)}
                                        onEdit={(evt) => {
                                            setEditingEvent(evt);
                                            setIsAddEditModalOpen(true);
                                        }}
                                        onDelete={handleDeleteEvent}
                                    />
                                </div>

                                {/* Shift Summary Stats Card */}
                                <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-5 shadow-lg relative overflow-hidden">
                                    <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl text-white">
                                        <i class="fa-solid fa-clock"></i>
                                    </div>
                                    <h4 class="text-xs font-semibold text-sky-400 uppercase tracking-wider mb-2">ສະຫຼຸບຮອບວຽກເດືອນນີ້</h4>
                                    
                                    {(() => {
                                        const year = currentDate.getFullYear();
                                        const month = currentDate.getMonth();
                                        const monthEvents = events.filter(e => {
                                            if (!e.date) return false;
                                            const d = new Date(e.date);
                                            return d.getFullYear() === year && d.getMonth() === month;
                                        });

                                        let totalHours = 0;
                                        monthEvents.forEach(e => {
                                            if (e.startTime && e.endTime) {
                                                const [h1, m1] = e.startTime.split(':').map(Number);
                                                const [h2, m2] = e.endTime.split(':').map(Number);
                                                let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
                                                if (diff < 0) diff += 24 * 60; // overnight shift
                                                totalHours += diff / 60;
                                            }
                                        });

                                        return (
                                            <div class="grid grid-cols-2 gap-3 mt-4">

        function CalendarMonthGrid({ currentDate, events, selectedDateStr, onSelectDate, onEventClick }) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const todayStr = new Date().toISOString().split('T')[0];

            // Build grid cells (42 cells: 6 weeks * 7 days)
            const gridDays = [];

            // Previous month tail days
            for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                const dayNum = daysInPrevMonth - i;
                const d = new Date(year, month - 1, dayNum);
                gridDays.push({
                    dateStr: d.toISOString().split('T')[0],
                    dayNum,
                    isCurrentMonth: false
                });
            }

            // Current month days
            for (let i = 1; i <= daysInMonth; i++) {
                const d = new Date(year, month, i);
                // Adjust timezone offset issue for accurate string
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                gridDays.push({
                    dateStr,
                    dayNum: i,
                    isCurrentMonth: true
                });
            }

            // Next month fill days
            const remainingCells = 42 - gridDays.length;
            for (let i = 1; i <= remainingCells; i++) {
                const d = new Date(year, month + 1, i);
                const dateStr = d.toISOString().split('T')[0];
                gridDays.push({
                    dateStr,
                    dayNum: i,
                    isCurrentMonth: false
                });
            }

            return (
                <div>
                    {/* Weekday headers */}
                    <div class="calendar-grid text-center font-bold text-xs text-slate-500 py-2 border-b border-slate-200">
                        {DAYS_LAO.map((day, idx) => (
                            <div key={idx} class={idx === 0 || idx === 6 ? 'text-rose-500' : ''}>
                                {day}
                            </div>
                        ))}
                    </div>

                    {/* Days Grid */}
                    <div class="calendar-grid gap-1 sm:gap-2 mt-2">
                        {gridDays.map((cell, idx) => {
                            const dayEvents = events.filter(e => e.date === cell.dateStr);
                            const isSelected = cell.dateStr === selectedDateStr;
                            const isToday = cell.dateStr === todayStr;

                            return (
                                <div
                                    key={idx}
                                    onClick={() => onSelectDate(cell.dateStr)}
                                    class={`min-h-[85px] sm:min-h-[105px] p-1.5 sm:p-2 rounded-xl border transition-all cursor-pointer flex flex-col justify-between ${
                                        !cell.isCurrentMonth ? 'bg-slate-50/60 border-slate-100 text-slate-400' :
                                        isSelected ? 'bg-sky-50/80 border-sky-400 ring-2 ring-sky-200 shadow-sm' :
                                        isToday ? 'bg-white border-amber-300 ring-1 ring-amber-300' :
                                        'bg-white border-slate-200 hover:border-slate-300 hover:shadow-xs'
                                    }`}
                                >
                                    <div class="flex items-center justify-between">
                                        <span class={`text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center ${
                                            isToday ? 'bg-amber-500 text-white' : 
                                            isSelected ? 'bg-sky-600 text-white' : 'text-slate-700'
                                        }`}>
                                            {cell.dayNum}
                                        </span>
                                        {dayEvents.length > 0 && (
                                            <span class="text-[10px] font-semibold text-slate-400 hidden sm:inline">
                                                {dayEvents.length} ລາຍການ
                                            </span>
                                        )}
                                    </div>

                                    {/* Event Chips */}
                                    <div class="mt-1 space-y-1 overflow-hidden">
                                        {dayEvents.slice(0, 2).map(evt => {
                                            const shiftStyle = SHIFT_TYPES[evt.type] || SHIFT_TYPES.normal;
                                            return (
                                                <div
                                                    key={evt.id}
                                                    onClick={(e) => {
                                                        e.stopPropagation();
                                                        onEventClick(evt);
                                                    }}
                                                    class={`${shiftStyle.bg} ${shiftStyle.text} text-[10px] sm:text-xs px-1.5 py-0.5 rounded-md truncate font-medium border ${shiftStyle.border} shadow-2xs hover:opacity-90`}
                                                    title={`${evt.title} (${evt.startTime}-${evt.endTime})`}
                                                >
                                                    <span class="font-bold">{evt.startTime}</span> {evt.title}
                                                </div>
                                            );
                                        })}
                                        {dayEvents.length > 2 && (
                                            <div class="text-[10px] text-slate-500 font-medium pl-1">
                                                +{dayEvents.length - 2} ຕື່ມອີກ...
                                            </div>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function PdfAiModal({ userName, onClose, onImportEvents, showToast }) {
            const [file, setFile] = useState(null);
            const [targetName, setTargetName] = useState(userName || '');
            const [isExtracting, setIsExtracting] = useState(false);
            const [statusStep, setStatusStep] = useState('');
            const [parsedResults, setParsedResults] = useState(null);

            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setFile(e.target.files[0]);
                }
            };

            const processPdfWithAi = async () => {
                if (!file) {
                    showToast("ກະລຸນາເລືອກໄຟລ໌ PDF ກ່ອນ", "warning");
                    return;
                }

                setIsExtracting(true);
                setStatusStep('ກຳລັງອ່ານຂໍ້ມູນເອກະສານ PDF...');

                try {
                    // Step 1: Read PDF binary data using FileReader
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                    let fullPdfText = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(" ");
                        fullPdfText += `[ໜ້າທີ ${i}]\n${pageText}\n`;
                    }

                    if (!fullPdfText.trim()) {
                        throw new Error("ບໍ່ສາມາດອ່ານຂໍ້ຄວາມຈາກໄຟລ໌ PDF ໄດ້ (ອາດເປັນໄຟລ໌ຮູບພາບ)");
                    }

                    setStatusStep('ກຳລັງໃຫ້ Gemini AI ວິເຄາະຕາຕະລາງຂອງ ' + (targetName || 'ທ່ານ') + '...');

                    const currentYear = new Date().getFullYear();
                    const promptText = `
ອ່ານຂໍ້ຄວາມຕາຕະລາງການເຮັດວຽກ/ການສອນ/ການປະຕິບັດງານຈາກໄຟລ໌ PDF ນີ້:
---
${fullPdfText.substring(0, 8000)}
---

ຊື່ພະນັກງານ/ບຸກຄົນ ທີ່ຕ້ອງການດຶງຂໍ້ມູນ: "${targetName}"

ກົດລະບຽບການດຶງຂໍ້ມູນຢ່າງເຂັ້ມງວດ:
1. ເຈາະຈົງດຶງສະເພາະຕາຕະລາງຂອງຄົນຊື່ "${targetName}" ເທົັ້ນນັ້ນ.
2. **ແຍກແຕ່ລະວາລະ / ຮອບວຽກ / ຄາບ / ຊ່ວງເວລາ ອອກເປັນແຕ່ລະລາຍການຢ່າງຈະແຈ້ງ (ຫ້າມຮວມກັນເປັນລາຍການດຽວເດັດຂາດ)**. ຖ້າໃນ 1 ວັນ ມີ 3 ວາລະ ທີ່ມີເວລາ ຫຼື ໜ້າທີ່/ວິຊາ ແຕກຕ່າງກັນ ໃຫ້ດຶງອອກມາເປັນ 3 ລາຍການແຍກກັນ.
3. ດຶງເວລາເລີ່ມຕົ້ນ (startTime) ແລະ ເວລາສິ້ນສຸດ (endTime) ຂອງແຕ່ລະວາລະໃຫ້ຖືກຕ້ອງຕາມ PDF.
4. ກວດເຊັກ Format ວັນທີ YYYY-MM-DD ໃຫ້ຖືກຕ້ອງ. ຖ້າໃນ PDF ບໍ່ມີປີ ໃຫ້ໃຊ້ປີປັດຈຸບັນ (${currentYear}).
5. ຖ້າເປັນວັນພັກ Day Off ໃຫ້ໃສ່ type ເປັນ "off".

ສົ່ງຄືນເປັນ JSON array strictly standard format:
[
  {
    "date": "YYYY-MM-DD",
    "startTime": "HH:MM",
    "endTime": "HH:MM",
    "title": "ຊື່ວາລະ, ວິຊາ ຫຼື ໜ້າທີ່ຫຼັກຂອງວາລະນັ້ນ",
    "type": "morning | afternoon | night | normal | overtime | off",
    "location": "ສະຖານທີ່ ຫຼື ແຜນກ/ຫ້ອງ",
    "notes": "ລາຍລະອຽດເພີ່ມເຕີມຂອງວາລະນັ້ນ"
  }
]
`;

                    const payload = {
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        date: { type: "STRING" },
                                        startTime: { type: "STRING" },
                                        endTime: { type: "STRING" },
                                        title: { type: "STRING" },
                                        type: { type: "STRING" },
                                        location: { type: "STRING" },
                                        notes: { type: "STRING" }
                                    },
                                    required: ["date", "title"]
                                }
                            }
                        }
                    };

                    const apiKey = ""; // Runtime automatically injects API key
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (!jsonText) {
                        throw new Error("AI ບໍ່ສາມາດວິເຄາະຂໍ້ມູນຕາຕະລາງໄດ້");
                    }

                    const rawExtractedEvents = JSON.parse(jsonText);
                    
                    // Deduplicate logic in JS: Only group if date, startTime, endTime AND title match strictly
                    const uniqueMap = new Map();
                    rawExtractedEvents.forEach((e) => {
                        if (!e.date) return;
                        const sTime = e.startTime || '08:00';
                        const eTime = e.endTime || '17:00';
                        const titleClean = (e.title || '').trim();
                        const key = `${e.date}_${sTime}_${eTime}_${titleClean}`;

                        if (!uniqueMap.has(key)) {
                            uniqueMap.set(key, { ...e });
                        }
                    });

                    const deduplicated = Array.from(uniqueMap.values());

                    // Add IDs and defaults
                    const formattedEvents = deduplicated.map((e, idx) => ({
                        id: 'ai-imported-' + Date.now() + '-' + idx,
                        date: e.date || new Date().toISOString().split('T')[0],
                        startTime: e.startTime || '08:00',

                        location: e.location || '',
                        notes: e.notes || 'ນໍາເຂົ້າອັດໂຕໂນມັດຈາກ PDF',
                        assignedTo: targetName,
                        notified: false
                    }));

                    if (formattedEvents.length === 0) {
                        showToast("ບໍ່ພົບຂໍ້ມູນຕາຕະລາງຂອງຊື່ນີ້ໃນ PDF", "warning");
                    } else {
                        showToast(`ວິເຄາະສຳເລັດ! ພົບ ${formattedEvents.length} ວາລະ/ຮອບວຽກ`, "success");
                    }

                    setParsedResults(formattedEvents);
                    setStatusStep('ວິເຄາະຂໍ້ມູນສຳເລັດແລ້ວ!');

                } catch (err) {
                    console.error("PDF AI Processing error:", err);
                    showToast("ເກີດຂໍ້ຜິດພາດ: " + err.message, "error");
                } finally {
                    setIsExtracting(false);
                }
            };

            // Remove a single event item from extracted list
            const handleRemoveItem = (indexToRemove) => {
                setParsedResults(prev => prev.filter((_, idx) => idx !== indexToRemove));
            };

            // Manual deduplicate trigger button in modal

                            </div>
                            <button onClick={onClose} class="text-slate-400 hover:text-slate-600 p-1">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {!parsedResults ? (
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">
                                        ຊື່ຂອງທ່ານໃນຕາຕະລາງ PDF
                                    </label>
                                    <input 
                                        type="text" 
                                        value={targetName}
                                        onChange={(e) => setTargetName(e.target.value)}
                                        placeholder="ໃສ່ຊື່ເພື່ອໃຫ້ AI ຄົ້ນຫາເຈາະຈົງ"
                                        class="w-full text-sm border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                    />
                                    <p class="text-[11px] text-slate-500 mt-1">
                                        AI ຈະຄົ້ນຫາຊື່ນີ້ໃນໄຟລ໌ PDF ແລ້ວດຶງເອົາສະເພາະວັນ ແລະ ເວລາຂອງຊື່ນີ້
                                    </p>
                                </div>

                                {/* PDF Drag & Drop area */}
                                <div class="border-2 border-dashed border-sky-200 bg-sky-50/50 hover:bg-sky-50 rounded-2xl p-6 text-center cursor-pointer transition relative">
                                    <input 
                                        type="file" 
                                        accept=".pdf" 
                                        onChange={handleFileChange}
                                        class="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                                    />
                                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-sky-500 mb-2"></i>
                                    <p class="text-xs font-semibold text-slate-700">
                                        {file ? file.name : "ກົດເພື່ອເລືອກໄຟລ໌ PDF ຕາຕະລາງວຽກ"}
                                    </p>
                                    <p class="text-[11px] text-slate-400 mt-1">
                                        ຮອງຮັບໄຟລ໌ .pdf ຕາຕະລາງປະຈຳເດືອນ ຫຼື ປະຈຳອາທິດ
                                    </p>
                                </div>

                                {isExtracting && (
                                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center space-y-2">
                                        <div class="inline-block animate-spin text-sky-600 text-xl">
                                            <i class="fa-solid fa-circle-notch"></i>
                                        </div>
                                        <p class="text-xs font-medium text-slate-700">{statusStep}</p>
                                    </div>
                                )}

                                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={simulateDemoExtract}
                                        class="text-xs font-semibold text-slate-500 hover:text-slate-700 underline"
                                    >
                                        ທົດລອງຂໍ້ມູນ Demo
                                    </button>
                                    <div class="space-x-2">
                                        <button 
                                            onClick={onClose}
                                            class="px-4 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl"
                                        >
                                            ຍົກເລີກ
                                        </button>
                                        <button 
                                            onClick={processPdfWithAi}
                                            disabled={isExtracting || !file}
                                            class={`px-4 py-2 text-xs font-semibold rounded-xl text-white shadow-sm transition ${
                                                isExtracting || !file ? 'bg-slate-300 cursor-not-allowed' : 'bg-sky-600 hover:bg-sky-700'
                                            }`}
                                        >
                                            ເລີ່ມດຶງຂໍ້ມູນດ້ວຍ AI
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* Preview Extracted Events */
                            <div class="space-y-4">
                                <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 flex items-center justify-between text-emerald-800 text-xs font-semibold">
                                    <div class="flex items-center space-x-2">
                                        <i class="fa-solid fa-circle-check text-emerald-600 text-base"></i>
                                        <span>AI ດຶງຂໍ້ມູນໄດ້ {parsedResults.length} ຮອບວຽກ</span>
                                    </div>
                                    <button 
                                        onClick={handleManualDeduplicate}
                                        class="text-[11px] bg-white text-emerald-700 border border-emerald-300 px-2.5 py-1 rounded-lg hover:bg-emerald-100 transition shadow-2xs"
                                        title="ກົດເພື່ອຮວມແຖວທີ່ວັນທີ ແລະ ເວລາຊໍ້າກັນ"
                                    >
                                        <i class="fa-solid fa-filter mr-1"></i>
                                        ຮວມລາຍການຊໍ້າ
                                    </button>
                                </div>

                                <div class="max-h-64 overflow-y-auto space-y-2 pr-1">
                                    {parsedResults.map((item, idx) => (
                                        <div key={idx} class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs flex justify-between items-start group hover:border-sky-300 transition">
                                            <div class="flex-1 pr-2">
                                                <div class="flex items-center space-x-2">
                                                    <span class="font-bold text-slate-800">{item.date}</span>
                                                    <span class="text-sky-700 font-semibold">({item.startTime} - {item.endTime})</span>
                                                </div>
                                                <p class="font-bold text-slate-700 mt-0.5">{item.title}</p>
                                                {item.location && <p class="text-slate-500 text-[11px]"><i class="fa-solid fa-location-dot mr-1"></i>{item.location}</p>}
                                                {item.notes && <p class="text-slate-500 text-[11px] italic mt-0.5">{item.notes}</p>}
                                            </div>
                                            <div class="flex items-center space-x-2">
                                                <span class="text-[10px] bg-sky-100 text-sky-800 px-2 py-0.5 rounded-full font-semibold">
                                                    {item.type}
                                                </span>
                                                <button 
                                                    onClick={() => handleRemoveItem(idx)}
                                                    class="text-slate-400 hover:text-rose-600 p-1 rounded transition"
                                                    title="ລົບລາຍການນີ້"
                                                >
                                                    <i class="fa-solid fa-trash text-xs"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                                    <button 
                                        onClick={() => setParsedResults(null)}
                                        class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-xl"
                                    >
                                        <i class="fa-solid fa-arrow-left mr-1"></i> ອັບໂຫຼດໄຟລ໌ໃໝ່
                                    </button>
                                    <div class="space-x-2">
                                        <button 
                                            onClick={onClose}
                                            class="px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-100 rounded-xl"
                                        >
                                            ຍົກເລີກ
                                        </button>
                                        <button 
                                            onClick={() => {
                                                onImportEvents(parsedResults);
                                                onClose();
                                            }}
                                            disabled={parsedResults.length === 0}
                                            class="px-4 py-2 text-xs font-semibold rounded-xl text-white bg-emerald-600 hover:bg-emerald-700 shadow-sm"
                                        >
                                            ຢືນຢັນເອົາເຂົ້າຕາຕະລາງ ({parsedResults.length})
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function AddEditEventModal({ eventData, onClose, onSave }) {
            const [formData, setFormData] = useState(eventData || {
                date: new Date().toISOString().split('T')[0],
                title: '',
                type: 'morning',
                startTime: '08:00',
                endTime: '16:00',
                location: '',
                notes: ''
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.title || !formData.date) return;
                onSave(formData);
            };

            return (
                <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100">
                        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                            <h3 class="font-bold text-slate-800 text-base">
                                {formData.id ? 'ແກ້ໄຂຕາຕະລາງ' : 'ເພີ່ມຕາຕະລາງໃໝ່'}
                            </h3>
                            <button onClick={onClose} class="text-slate-400 hover:text-slate-600">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} class="space-y-4 text-xs">
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">ຊື່ຮອບວຽກ / ໜ້າທີ່ *</label>
                                <input 
                                    type="text" 
                                    required
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    placeholder="ເຊັ່ນ: ກະເຊົ້າ A, ເຂົ້າເວນປະຈຳການ"
                                    class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                />
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">ວັນທີ *</label>
                                    <input 
                                        type="date" 
                                        required
                                        value={formData.date}
                                        onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                                        class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">ປະເພດຮອບວຽກ</label>
                                    <select 
                                        value={formData.type}
                                        onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                                        class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none bg-white"
                                    >
                                        {Object.entries(SHIFT_TYPES).map(([key, value]) => (
                                            <option key={key} value={key}>{value.label}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">ເວລາເລີ່ມ</label>
                                    <input 
                                        type="time" 
                                        value={formData.startTime}
                                        onChange={(e) => setFormData({ ...formData, startTime: e.target.value })}
                                        class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">ເວລາສິ້ນສຸດ</label>
                                    <input 
                                        type="time" 
                                        value={formData.endTime}
                                        onChange={(e) => setFormData({ ...formData, endTime: e.target.value })}
                                        class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">ສະຖານທີ່</label>
                                <input 
                                    type="text" 
                                    value={formData.location || ''}
                                    onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                                    placeholder="ເຊັ່ນ: ຕຶກ B, ຫ້ອງ 302"
                                    class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                />
                            </div>

                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">ໝາຍເຫດ</label>
                                <textarea 
                                    rows="2"
                                    value={formData.notes || ''}
                                    onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                                    placeholder="ລາຍລະອຽດ ຫຼື ບັນທຶກເພີ່ມເຕີມ..."
                                    class="w-full border border-slate-300 rounded-xl px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
                                ></textarea>
                            </div>

                            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
                                <button 
                                    type="button"
                                    onClick={onClose}
                                    class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-xl"
                                >
                                    ຍົກເລີກ
                                </button>
                                <button 
                                    type="submit"
                                    class="px-4 py-2 font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-xl shadow-sm"
                                >
                                    ບັນທຶກ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Helper date formatter in Lao
        function formatDateLao(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const dayName = DAYS_LAO[d.getDay()];
            const dayNum = d.getDate();
            const monthName = MONTHS_LAO[d.getMonth()];
            const year = d.getFullYear();
            return `ວັນ${dayName}, ວັນທີ ${dayNum} ${monthName} ${year}`;
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
